name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Fresh Flutter App with Full Android Scaffolding
        run: |
          # Backup user lib/main.dart
          cp lib/main.dart /tmp/saved_main.dart
          
          # Remove manually created partial folders to avoid conflicts
          rm -rf android pubspec.yaml
          
          # Auto-generate modern Flutter project with proper v2 embedding
          flutter create --org com.example --project-name ai_video_maker .
          
          # Restore user code
          cp /tmp/saved_main.dart lib/main.dart
          
          # Add internet permission to generated AndroidManifest
          sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET"/>\n<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>' android/app/src/main/AndroidManifest.xml
          
          # Add required dependencies automatically
          flutter pub add http image_picker video_player chewie path_provider

      - name: Build Standalone APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          
